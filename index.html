<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Login</title>
</head>
<body class="bg-red-600">
    <div class="text-red-600 text-5xl flex justify-center mt-20 mb-10 w-full h-20 gap-3">.</div>
    <div class="text-white text-5xl flex justify-center mt-20 mb-10">Criar Conta</div>
    <div class="item-center justify-center flex w-full h-12 gap-3">
        <img src="redes-sociais.png" alt="Logos de Redes Sociais">
    </div>
    <div class="flex justify-center mt-5 mb-5">
        <p class="text-white">ou <a class="cadastro hover:text-blue-500 cursor-pointer transition">cadastre seu email</a> </p>
    </div>
    <div class="flex justify-center">
        <div class="w-80 space-y-4">
            <input type="text" placeholder="Nome" class="w-full bg-gray-200 p-3 rounded text-gray-700 placeholder-gray-500" />
            <input type="email" placeholder="Email" class="w-full bg-gray-200 p-3 rounded text-gray-700 placeholder-gray-500" />
            <input type="password" placeholder="Senha" class="w-full bg-gray-200 p-3 rounded text-gray-700 placeholder-gray-500" />
            <button class="block mx-auto text-white font-semibold px-10 py-2 rounded-full border-2 border-white uppercase transition hover:text-blue-600 hover:border-blue-600 active:text-black active:border-black">
                Cadastrar
              </button>
            <div class="flex gap-1 text-white justify-center">
                <p>Já tem conta?</p>
                <p class="font-bold"> <a class="login hover:text-blue-500 cursor-pointer transition">Login</a></p>
            </div>
        </div>
</body>
</html>
